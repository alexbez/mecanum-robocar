; Mecanum robocar + ESP-NOW joystick remote
;
;   Robocar : YD-ESP32-S3 ("YD-ESP32-23", ESP32-S3-WROOM-1, DevKitC-1 pinout,
;             onboard WS2812 RGB LED), 2x TB6612FNG,
;             4x 25GA-370 12 V gear motors (1:103, 11 PPR Hall encoder)
;   Remote  : LilyGo T-Display-S3 (ST7789 170x320) + analog joystick
;
;   pio run -e robocar -t upload        ; flash the car
;   pio run -e remote  -t upload        ; flash the remote
;   pio device monitor -e robocar       ; serial log
;
; If both boards are plugged in at once, set upload_port / monitor_port
; per environment (examples below).

[platformio]
default_envs = robocar, remote

[env]
; espressif32 6.x = Arduino-ESP32 2.0.17 (ESP-IDF 4.4). The code also has
; compatibility shims for Arduino-ESP32 3.x.
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    ; Both firmwares must use the same Wi-Fi channel and pairing key.
    -DROBO_WIFI_CHANNEL=1
    -DROBO_PAIR_KEY=0x4D45434Bu

; ---------------------------------------------------------------------------
[env:robocar]
; YD-ESP32-S3 is a DevKitC-1 clone, so the DevKitC-1 definition fits.
; It assumes 8 MB flash and no PSRAM, which runs on every module variant.
; For an N16R8 module you can use the full flash (PSRAM is not needed):
;board_upload.flash_size = 16MB
;board_build.partitions = default_16MB.csv
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<robocar/>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    ${env.build_flags}
;upload_port  = /dev/cu.usbserial-CAR
;monitor_port = /dev/cu.usbserial-CAR

; Same firmware, but flashed and monitored through the board's native "USB"
; port instead of "COM". Serial goes to native USB (CDC) instead of UART0.
[env:robocar_usb]
extends = env:robocar
build_flags =
    ${env:robocar.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
[env:remote]
board = lilygo-t-display-s3
build_src_filter = -<*> +<remote/>
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    ${env.build_flags}
    ; ---- TFT_eSPI configuration for LilyGo T-Display-S3 (Setup206) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=0
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
;upload_port  = /dev/cu.usbmodem-REMOTE
;monitor_port = /dev/cu.usbmodem-REMOTE
